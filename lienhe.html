<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-wrapper {
            background-color: #ffffff;
            width: 100%;
            max-width: 820px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
        }

        /* Cột trái: Thông tin liên hệ */
        .contact-info {
            width: 40%;
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 32px 28px;
        }

        .contact-info h2 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .contact-info p.desc {
            font-size: 14px;
            color: #dbeafe;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .info-item {
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .info-item strong {
            display: block;
            color: #93c5fd;
            margin-bottom: 2px;
        }

        /* Cột phải: Form gửi tin nhắn */
        .contact-form {
            width: 60%;
            padding: 32px 30px;
        }

        .contact-form h2 {
            font-size: 22px;
            color: #111827;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #374151;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button[type="submit"] {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px 24px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        /* Responsive cho màn hình nhỏ */
        @media (max-width: 680px) {
            .contact-info,
            .contact-form {
                width: 100%;
            }
        }
    </style>
</head>
<body>
        <div class="contact-form">
            <h2>Gửi tin nhắn</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name" name="name" placeholder="Nhập họ và tên của bạn" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <input type="text" id="subject" name="subject" placeholder="Nhập tiêu đề liên hệ" required>
                </div>

                <div class="form-group">
                    <label for="message">Nội dung</label>
                    <textarea id="message" name="message" placeholder="Nhập nội dung tin nhắn..." required></textarea>
                </div>

                <button type="submit">Gửi liên hệ</button>
            </form>
        </div>
    </div>

</body>
</html>
