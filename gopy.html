<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góp ý</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .feedback-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            font-size: 22px;
            color: #111827;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #374151;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Mức độ hài lòng dạng nút chọn */
        .rating-group {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .rating-group label {
            flex: 1;
            text-align: center;
            padding: 8px 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-weight: normal;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 0;
            transition: all 0.2s;
        }

        .rating-group input[type="radio"] {
            display: none;
        }

        .rating-group input[type="radio"]:checked + span {
            font-weight: bold;
            color: #1d4ed8;
        }

        .rating-group label:has(input[type="radio"]:checked) {
            border-color: #2563eb;
            background-color: #eff6ff;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        button {
            flex: 1;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"] {
            background-color: #2563eb;
            color: #ffffff;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="reset"] {
            background-color: #e5e7eb;
            color: #374151;
        }

        button[type="reset"]:hover {
            background-color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="feedback-container">
        <h2>Hộp thư góp ý</h2>
        <p class="subtitle">Ý kiến của bạn giúp chúng tôi cải thiện chất lượng tốt hơn</p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="fullname">Họ và tên (không bắt buộc)</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập tên của bạn">
            </div>

            <div class="form-group">
                <label for="email">Email liên hệ</label>
                <input type="email" id="email" name="email" placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label for="topic">Chủ đề góp ý</label>
                <select id="topic" name="topic">
                    <option value="giao-dien">Giao diện & Trải nghiệm</option>
                    <option value="noi-dung">Nội dung & Chức năng</option>
                    <option value="bao-loi">Báo lỗi kỹ thuật</option>
                    <option value="khac">Góp ý khác</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mức độ hài lòng</label>
                <div class="rating-group">
                    <label>
                        <input type="radio" name="rating" value="1">
                        <span>Rất tệ</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="2">
                        <span>Tệ</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="3" checked>
                        <span>Bình thường</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="4">
                        <span>Tốt</span>
                    </label>
                    <label>
                        <input type="radio" name="rating" value="5">
                        <span>Rất tốt</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="content">Nội dung góp ý</label>
                <textarea id="content" name="content" placeholder="Nhập nội dung góp ý chi tiết tại đây..." required></textarea>
            </div>

            <div class="btn-group">
                <button type="reset">Nhập lại</button>
                <button type="submit">Gửi góp ý</button>
            </div>
        </form>
    </div>

</body>
</html>
